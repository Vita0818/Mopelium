name: Mopelium

options:
  bundleIdPrefix: com.vita
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  MopeliumCore:
    type: framework
    platform: macOS
    sources:
      - Packages/MopeliumCore/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.vita.MopeliumCore

  MopeliumProviders:
    type: framework
    platform: macOS
    sources:
      - Packages/MopeliumProviders/Sources
    dependencies:
      - target: MopeliumCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.vita.MopeliumProviders

  MopeliumTools:
    type: framework
    platform: macOS
    sources:
      - Packages/MopeliumTools/Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.vita.MopeliumTools

  MopeliumAgent:
    type: framework
    platform: macOS
    sources:
      - Packages/MopeliumAgent/Sources
    dependencies:
      - target: MopeliumCore
      - target: MopeliumProviders
      - target: MopeliumTools
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.vita.MopeliumAgent

  mopelium:
    type: tool
    platform: macOS
    sources:
      - Apps/mopelium-cli/Sources
    dependencies:
      - target: MopeliumCore
      - target: MopeliumProviders
      - target: MopeliumTools
      - target: MopeliumAgent
    settings:
      base:
        OTHER_SWIFT_FLAGS: "$(inherited) -parse-as-library"

  MopeliumMac:
    type: application
    platform: macOS
    sources:
      - Apps/MopeliumMac/Sources
    dependencies:
      - target: MopeliumCore
      - target: MopeliumProviders
      - target: MopeliumTools
      - target: MopeliumAgent
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vita.MopeliumMac
        INFOPLIST_FILE: Apps/MopeliumMac/Info.plist
        ENABLE_HARDENED_RUNTIME: "YES"

schemes:
  MopeliumMac:
    build:
      targets:
        MopeliumMac: all
    run:
      config: Debug

  mopelium:
    build:
      targets:
        mopelium: all
    run:
      config: Debug
