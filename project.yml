# XcodeGen spec — generates the Xcode project that builds the real .app bundles.
#
#   brew install xcodegen      # one-time
#   xcodegen generate          # creates Mopelium.xcodeproj
#   open Mopelium.xcodeproj     # pick the MopeliumMac or MopeliumiOS scheme, then Run
#
# The App targets link the Swift Package products in this repo. The iOS app links
# ONLY the chat subset (no Tools / Permission / AgentKernel / Cowork).

name: Mopelium

options:
  bundleIdPrefix: com.Vita0818
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true
  localPackagesGroup: "Internal Modules"
  postGenCommand: "sh scripts/hide-xcode-package-schemes.sh"

packages:
  Mopelium:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.12"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: "YES"
    GENERATE_INFOPLIST_FILE: "NO"
    # To run on a device or archive for distribution, set your team:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:

  # ---- macOS app: full Chat / Code / Cowork (links all 11 library products) ----
  MopeliumMac:
    type: application
    platform: macOS
    sources:
      - Apps/MopeliumMac/Sources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.MopeliumMac
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Mopelium
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Mopelium contributors. See NOTICE.md."
        CODE_SIGN_ENTITLEMENTS: Apps/MopeliumMac/MopeliumMac.DeveloperID.entitlements
        # AppStore/chat-only builds can still switch back to:
        #   CODE_SIGN_ENTITLEMENTS: Apps/MopeliumMac/MopeliumMac.AppStore.entitlements
        #   and set AppConfig.platformProfile = .macAppStore
    dependencies:
      - package: Mopelium
        product: MopeliumCore
      - package: Mopelium
        product: MopeliumProtocol
      - package: Mopelium
        product: MopeliumProviders
      - package: Mopelium
        product: MopeliumConversation
      - package: Mopelium
        product: MopeliumArtifacts
      - package: Mopelium
        product: MopeliumMultimodal
      - package: Mopelium
        product: MopeliumSharedUI
      - package: Mopelium
        product: MopeliumTools
      - package: Mopelium
        product: MopeliumPermission
      - package: Mopelium
        product: MopeliumAgentKernel
      - package: Mopelium
        product: MopeliumCowork

  # ---- iOS app: chat-only SUBSET (deliberately no workspace stack) ----
  MopeliumiOS:
    type: application
    platform: iOS
    sources:
      - Apps/MopeliumiOS/Sources
      - Apps/MopeliumiOS/Resources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Mopelium
        TARGETED_DEVICE_FAMILY: "1,2"
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Mopelium
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mopelium uses the microphone for voice input transcription."
    dependencies:
      - package: Mopelium
        product: MopeliumCore
      - package: Mopelium
        product: MopeliumProtocol
      - package: Mopelium
        product: MopeliumProviders
      - package: Mopelium
        product: MopeliumConversation
      - package: Mopelium
        product: MopeliumArtifacts
      - package: Mopelium
        product: MopeliumMultimodal
      - package: Mopelium
        product: MopeliumSharedUI

schemes:
  MopeliumMac:
    build:
      targets:
        MopeliumMac: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 0
      isShown: true

  MopeliumiOS:
    build:
      targets:
        MopeliumiOS: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 1
      isShown: true
