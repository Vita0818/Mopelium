# XcodeGen spec — generates the Xcode project that builds the real .app bundles.
#
#   brew install xcodegen      # one-time
#   xcodegen generate          # creates Mopelium.xcodeproj
#   open Mopelium.xcodeproj     # pick the MopeliumMac scheme, then Run
#
# The sole App target links the Swift Package products in this repo.

name: Mopelium

options:
  bundleIdPrefix: com.Vita0818
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  localPackagesGroup: "Internal Modules"
  postGenCommand: "sh scripts/hide-xcode-package-schemes.sh"

packages:
  Mopelium:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.10"
    CURRENT_PROJECT_VERSION: "49"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "NO"
    # To run on a device or archive for distribution, set your team:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:

  # ---- macOS DeveloperID app: Chat / Code / Cowork + stdio/HTTP MCP client ----
  MopeliumMac:
    type: application
    platform: macOS
    sources:
      - Apps/MopeliumMac/Sources
      - Apps/MopeliumMac/Resources
      - path: Mopelium.icon
        buildPhase: resources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Mopelium
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Mopelium
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Mopelium contributors. See NOTICE.md."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mopelium uses the microphone to turn voice into editable message drafts."
        ASSETCATALOG_COMPILER_APPICON_NAME: Mopelium
        CODE_SIGN_ENTITLEMENTS: Apps/MopeliumMac/MopeliumMac.DeveloperID.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: "YES"
    dependencies:
      - package: Mopelium
        product: MopeliumCore
      - package: Mopelium
        product: MopeliumProtocol
      - package: Mopelium
        product: MopeliumProviders
      - package: Mopelium
        product: MopeliumConversation
      - package: Mopelium
        product: MopeliumArtifacts
      - package: Mopelium
        product: MopeliumMultimodal
      - package: Mopelium
        product: MopeliumSharedUI
      - package: Mopelium
        product: MopeliumTools
      - package: Mopelium
        product: MopeliumKnowledge
      - package: Mopelium
        product: MopeliumPermission
      - package: Mopelium
        product: MopeliumAgentKernel
      - package: Mopelium
        product: MopeliumSkills
      - package: Mopelium
        product: MopeliumCowork
      - package: Mopelium
        product: MopeliumMCP
      - package: Mopelium
        product: MopeliumMCPStdio

schemes:
  MopeliumMac:
    build:
      targets:
        MopeliumMac: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 0
      isShown: true
